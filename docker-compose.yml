# ==============================================================
# Proyecto PHP — versión 4: el mismo sistema contra TRES motores
#
#                                                        ┌→ MariaDB
#   Navegador → FRONT PHP (:8088) → API FACTURAS (:8090) ┼→ PostgreSQL
#   Navegador → phpMyAdmin (:8104) ─────────────────────→┴→ SQL Server
#
# Cuál de los tres usa la API lo decide **una variable de entorno** —`MOTOR`—,
# no un cambio de código. Y el front no se entera: sigue hablando con la misma
# API por el mismo puerto.
#
# Para cambiar de motor, en PowerShell:
#     $env:MOTOR = "postgres"    # o "sqlserver", o "mariadb"
#     docker compose up -d --no-deps --force-recreate api-facturas
#
# ESTE ARCHIVO ES EL COMPOSE COMPLETO al que apuntaba la ruta de versiones
# desde la v1: seis servicios, tres motores, un solo comando.
#
# Y fíjese en el servicio `sqlserver-init`, que no tiene pareja en los otros
# dos motores: las imágenes de MariaDB y PostgreSQL ejecutan solas cualquier
# .sql que encuentren en una carpeta convenida. La de SQL Server no tiene ese
# mecanismo, así que hace falta un contenedor de un solo uso que espere,
# cree la base y corra el script. Los tres motores no se dejan levantar
# igual — y eso se nota antes de escribir una línea de PHP.
#
# Uso: docker compose up -d --build     (UN solo comando)
# Reset de la BD: docker compose down -v && docker compose up -d
#
# LAS FLECHAS DICEN LA ARQUITECTURA. Fíjese en que del front NO sale ninguna
# flecha hacia MariaDB, y que eso no es un dibujo bonito: es lo que este
# archivo hace cumplir. `front-php` no tiene ni las credenciales de la base ni
# el `depends_on` que la mencione, así que aunque alguien escribiera un
# `new PDO(...)` en el front, no tendría ni con qué ni a dónde conectarse.
#
# Este archivo dejó de crecer: la v4 es el final de la ruta.
# Los puertos cambian en cada versión a propósito: así se pueden tener
# dos versiones encendidas a la vez y compararlas.
# ==============================================================
services:

  # --- MariaDB 11 con la BD bdfacturas COMPLETA (db/init.sql) ---
  mariadb:
    restart: unless-stopped   # si el PC se reinicia, este servicio revive con Docker
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: paradigmas123
      MARIADB_DATABASE: bdfacturas_mariadb_local
      MARIADB_USER: paradigmas
      MARIADB_PASSWORD: paradigmas123
    volumes:
      - mariadbdata:/var/lib/mysql            # los datos sobreviven a `down`
      - ./db/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        # ↑ se ejecuta SOLO con el volumen vacío (primera vez / tras down -v)
      - ./db/mariadb/init_phpmyadmin.sql:/docker-entrypoint-initdb.d/init_phpmyadmin.sql:ro
        # ↑ BD interna de phpMyAdmin (habilita el Diseñador y otras extras)
    ports:
      - "13329:3306"     # puerto en su PC (para HeidiSQL/DBeaver opcional)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- PostgreSQL 16 con la MISMA base de datos, en su dialecto ---
  #
  # Fíjese en que las dos bases se llaman distinto por dentro
  # (bdfacturas_mariadb_local y bdfacturas_postgres_local) y tienen las MISMAS
  # 12 tablas con los MISMOS datos. Eso es lo que hace posible la versión: dos
  # motores, un solo sistema.
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bdfacturas_postgres_local
      POSTGRES_USER: paradigmas
      POSTGRES_PASSWORD: paradigmas123
    volumes:
      - pgdata:/var/lib/postgresql/data          # los datos sobreviven a `down`
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        # ↑ se ejecuta SOLO con el volumen vacío (primera vez / tras down -v)
    ports:
      - "15465:5432"     # puerto en su PC (para DBeaver/pgAdmin opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradigmas -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- SQL Server 2022 con la MISMA base de datos, en T-SQL ---
  #
  # Tres cosas que este servicio necesita y los otros dos no:
  #   · una clave que cumpla SU política (mayúscula, número y símbolo);
  #   · aceptar la licencia con ACCEPT_EULA;
  #   · y un contenedor aparte que cree la base (ver `sqlserver-init`).
  sqlserver:
    restart: unless-stopped
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Paradigmas123!"
      MSSQL_PID: "Developer"
    volumes:
      - mssqldata:/var/opt/mssql          # los datos sobreviven a `down`
    ports:
      - "11474:1433"     # puerto en su PC (para SSMS/Azure Data Studio opcional)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --- El que crea la base de SQL Server, UNA sola vez ---
  #
  # `restart: "no"` porque este contenedor termina y se queda quieto: no es un
  # servicio, es un encargo. Si la base ya existe, no hace nada (el script lo
  # comprueba antes) — así se puede volver a levantar el sistema sin miedo.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Paradigmas123!"
    volumes:
      - ./db/sqlserver:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  # --- API Facturas v1 — PHP puro + PDO ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app        # el código montado: guardar un .php = refrescar
    restart: unless-stopped
    ports:
      - "8090:8090"                # http://localhost:8090
    environment:
      # ==========================================================
      # LA VARIABLE QUE DECIDE TODO
      # ==========================================================
      # `${MOTOR:-mariadb}` significa: usa la variable MOTOR del entorno, y si
      # no está, usa "mariadb". Así el comando de siempre sigue funcionando y
      # cambiar de motor es una palabra:
      #     $env:MOTOR = "postgres"; docker compose up -d
      #
      # Esta variable NO cambia ninguna línea de código. La lee el ensamblador
      # y con ella escoge qué clase de repositorio construir — es el principio
      # abierto/cerrado, y este renglón del compose es su examen.
      MOTOR: ${MOTOR:-mariadb}

      # Los DOS juegos de credenciales viajan siempre, y el ensamblador usa el
      # que corresponda. Se prefirió esto a tener dos servicios de API porque
      # el punto de la versión es justamente que **es el mismo programa**.
      DB_DSN_MARIADB: mysql:host=mariadb;port=3306;dbname=bdfacturas_mariadb_local
      DB_DSN_POSTGRES: pgsql:host=postgres;port=5432;dbname=bdfacturas_postgres_local
      DB_USUARIO: paradigmas
      DB_CLAVE: paradigmas123

      # SQL Server no usa el mismo usuario que los otros dos, y no es un
      # descuido: su cuenta administrativa se llama `sa` y su clave tiene que
      # cumplir una política de complejidad. Por eso viaja aparte.
      #
      # `TrustServerCertificate=yes` acepta el certificado que el servidor se
      # genera solo. En un entorno de curso está bien; **en producción no se
      # pone**, porque desactiva la comprobación de con quién se está hablando.
      DB_DSN_SQLSERVER: sqlsrv:Server=sqlserver,1433;Database=bdfacturas_sqlserver_local;TrustServerCertificate=yes
      DB_USUARIO_SQLSERVER: sa
      DB_CLAVE_SQLSERVER: "Paradigmas123!"
    depends_on:
      mariadb:
        condition: service_healthy   # arranca cuando la BD RESPONDE, no por azar
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  # --- Front Facturas v1 — PHP puro, la pantalla del usuario ---
  front-php:
    build: ./front_php
    volumes:
      - ./front_php:/app           # el código montado: guardar un .php = refrescar
    restart: unless-stopped
    ports:
      - "8088:8088"                # http://localhost:8088
    environment:
      # Lo ÚNICO que el front necesita saber: dónde está la API. Ni DB_DSN, ni
      # usuario, ni clave de la base — no las tiene porque no las puede usar.
      URL_API: http://api-facturas:8090
      #        ↑ el NOMBRE DEL SERVICIO, no localhost: dentro de un contenedor
      #          localhost es el contenedor mismo, y ahí no hay ninguna API.
    depends_on:
      - api-facturas               # y NO mariadb: el front no sabe que existe

  # --- phpMyAdmin (administrador web de MariaDB, también en Docker) ---
  phpmyadmin:
    restart: unless-stopped   # si el PC se reinicia, este servicio revive con Docker
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb              # a cuál servidor se conecta (nombre del servicio)
      PMA_USER: paradigmas
      PMA_PASSWORD: paradigmas123
    ports:
      - "8104:80"                    # http://localhost:8104
    depends_on:
      - mariadb

volumes:
  mariadbdata:
  pgdata:
  mssqldata:
